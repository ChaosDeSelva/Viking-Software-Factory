apiVersion: brokkr.dev/v1alpha1
kind: Harness
metadata:
  name: e2e-missing-dep
  version: 1.0.0
  description: Brokkr e2e fixture harness e2e-missing-dep
compatibility:
  platforms: [darwin, linux]
  taskTypes: [frontend]

skills:
  required: []
  optional: []
workflow:
  stages: [implement, typecheck, test]
checks:
  - id: typecheck
    command: [pnpm, exec, tsc, --noEmit]
    required: true
    timeoutSeconds: 120
policies:
  network: deny
  destructiveCommands: deny
  requireApprovalFor: [install-dependencies]
evidence:
  captureLogs: true
  captureTestResults: true
  captureScreenshots: false
