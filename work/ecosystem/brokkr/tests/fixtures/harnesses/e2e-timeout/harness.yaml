apiVersion: brokkr.dev/v1alpha1
kind: Harness
metadata:
  name: e2e-timeout
  version: 1.0.0
  description: Brokkr e2e fixture harness e2e-timeout
compatibility:
  platforms: [darwin, linux]
  taskTypes: [frontend]

skills:
  required: []
  optional: []
workflow:
  stages: [implement, typecheck, test]
checks:
  - id: slow
    command: [node, scripts/tree.mjs]
    required: true
    timeoutSeconds: 5
policies:
  network: deny
  destructiveCommands: deny
  requireApprovalFor: [install-dependencies]
evidence:
  captureLogs: true
  captureTestResults: true
  captureScreenshots: false
