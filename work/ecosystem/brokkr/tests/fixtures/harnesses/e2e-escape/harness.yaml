apiVersion: brokkr.dev/v1alpha1
kind: Harness
metadata:
  name: e2e-escape
  version: 1.0.0
  description: Brokkr e2e fixture harness e2e-escape
compatibility:
  platforms: [darwin, linux]
  taskTypes: [frontend]

skills:
  required: []
  optional: []
workflow:
  stages: [implement, typecheck, test]
checks:
  - id: escape
    command: [node, scripts/marker.mjs, escaped]
    cwd: ../..
    required: true
    timeoutSeconds: 60
policies:
  network: deny
  destructiveCommands: deny
  requireApprovalFor: [install-dependencies]
evidence:
  captureLogs: true
  captureTestResults: true
  captureScreenshots: false
