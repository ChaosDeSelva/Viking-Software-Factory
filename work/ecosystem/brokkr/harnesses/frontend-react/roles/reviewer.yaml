name: reviewer
description: "Reviews UI component, state and styling changes in a React + TypeScript app, focusing on layout at 1280x800 and 390x844, keyboard access and axe results."
skills:
  - react-architecture
  - typescript
  - accessibility
  - responsive-design
  - component-reuse
  - playwright
  - visual-qa
