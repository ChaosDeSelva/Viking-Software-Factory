# Local-only CI definition. Mimir has no remote yet; this file documents the
# intended pipeline and will run unchanged if the repo is ever hosted.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-macos:
    name: check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install terminal runtime test dependency
        run: brew install tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  check-linux:
    name: check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
