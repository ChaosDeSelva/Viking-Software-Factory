name: Experimental adapter compatibility
description: Report a vendor or terminal integration issue with reproducible evidence
title: "[Adapter] "
labels: [bug]
body:
  - type: input
    id: adapter
    attributes:
      label: Agent and terminal backend
      description: Include the CLI or application version and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Small reproduction
      description: Use a synthetic workspace. Include steps, expected behavior, and observed behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Include capability output, observed state, and relevant error messages. Remove tokens, account details, private paths, prompts, and source code.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials and private project content from this report.
          required: true
