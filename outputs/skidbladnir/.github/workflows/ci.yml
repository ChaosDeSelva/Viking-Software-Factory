name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s infra/aws -p "test_*.py"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-isolated.mjs
