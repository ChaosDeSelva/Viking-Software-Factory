[package]
name = "viking-manager"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "viking"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
fs2 = "0.4"
semver = "1"
ring = "0.17"
base64 = "0.22"

tempfile = "3"
